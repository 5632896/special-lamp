name: Publish split Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v1.31.0
      installer_name:
        description: Final NSIS installer filename
        required: true
        default: 英语阅读工具_1.31.0_x64-setup.exe
      part_prefix:
        description: Prefix of sequential 000, 001, ... assets
        required: true
        default: setup-v1.31.0.part-

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer parts and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PART_PREFIX: ${{ inputs.part_prefix }}
        run: |
          mkdir -p parts dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "${PART_PREFIX}*" --dir parts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir dist

      - name: Reassemble and verify the original installer
        env:
          INSTALLER_NAME: ${{ inputs.installer_name }}
          PART_PREFIX: ${{ inputs.part_prefix }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          installer = os.environ['INSTALLER_NAME']
          prefix = os.environ['PART_PREFIX']
          parts = sorted(path for path in Path('parts').iterdir() if path.name.startswith(prefix))
          if not parts:
              raise SystemExit('No installer parts were downloaded')
          for index, part in enumerate(parts):
              if part.name != f'{prefix}{index:03d}':
                  raise SystemExit(f'Missing or unexpected part: {part.name}')
          lines = Path('dist/SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()
          hashes = [line.split(' *', 1)[0] for line in lines if line.endswith(' *' + installer)]
          if len(hashes) != 1:
              raise SystemExit('Expected exactly one checksum for the requested installer')
          output = Path('dist') / installer
          digest = hashlib.sha256()
          with output.open('wb') as target:
              for part in parts:
                  with part.open('rb') as source:
                      while chunk := source.read(1024 * 1024):
                          target.write(chunk)
                          digest.update(chunk)
          if digest.hexdigest().lower() != hashes[0].lower():
              output.unlink()
              raise SystemExit('Installer SHA-256 mismatch; refusing to publish')
          print(f'Verified {output.name}: {output.stat().st_size} bytes, SHA-256 {digest.hexdigest()}')
          PY

      - name: Upload the verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          INSTALLER_NAME: ${{ inputs.installer_name }}
        run: gh release upload "$RELEASE_TAG" "dist/$INSTALLER_NAME" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify the published asset digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          INSTALLER_NAME: ${{ inputs.installer_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          repository = os.environ['GITHUB_REPOSITORY']
          filename = os.environ['INSTALLER_NAME']
          data = subprocess.check_output(['gh', 'api', f'repos/{repository}/releases/tags/{tag}'])
          release = json.loads(data)
          assets = [asset for asset in release['assets'] if asset['name'] == filename]
          if len(assets) != 1:
              raise SystemExit('The installer asset is missing or duplicated')
          path = Path('dist') / filename
          expected = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          asset = assets[0]
          if asset['state'] != 'uploaded' or asset['size'] != path.stat().st_size or asset.get('digest') != expected:
              raise SystemExit('Published asset size or digest did not match the local installer')
          print(f'GitHub Release asset verified: {filename} ({asset["size"]} bytes, {expected})')
          PY

      - name: Remove temporary parts after installer verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PART_PREFIX: ${{ inputs.part_prefix }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          prefix = os.environ['PART_PREFIX']
          data = subprocess.check_output(['gh', 'api', f'repos/{repository}/releases/tags/{tag}'])
          release = json.loads(data)
          parts = [asset for asset in release['assets'] if asset['name'].startswith(prefix)]
          for part in parts:
              subprocess.run(['gh', 'api', '--method', 'DELETE', f'repos/{repository}/releases/assets/{part["id"]}'], check=True)
          print(f'Removed {len(parts)} temporary release parts')
          PY
